server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/userdb
    username: postgres
    password: Database@123

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    enabled: true

  instance:
    prefer-ip-address: true
    ip-address: 172.17.7.228
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

jwt:
  secret: "00SpringMicro00Service00BookOrder00Application"
  expiration: 86400000
  refresh-expiration: 604800000